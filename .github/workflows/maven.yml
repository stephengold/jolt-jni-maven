---
# GitHub Actions workflow for commits pushed to the jolt-jni-maven repo - master branch

name: Java CI with Maven
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  Java17-Linux_ARM64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          cache: maven
          distribution: 'temurin'
          java-version: '17'
      - run: mvn -B package --file pom.xml

  Java17-MacOSX64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          cache: maven
          distribution: 'temurin'
          java-version: '17'
      - run: mvn -B package --file pom.xml

  Java21-MacOSX_ARM64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          cache: maven
          distribution: 'temurin'
          java-version: '21'
      - run: mvn -B package --file pom.xml

  Java21-Windows_ARM64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          cache: maven
          distribution: 'temurin'
          java-version: '21'
      - run: mvn -B package --file pom.xml
        shell: bash

  Java25-Windows64:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          cache: maven
          distribution: 'temurin'
          java-version: '25'
      - run: mvn -B package --file pom.xml
        shell: bash

  Java26-Linux:
    if: contains(toJson(github.event.commits), '[ci skip] ') == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          cache: maven
          distribution: 'temurin'
          java-version: '26'
      - run: mvn -B package --file pom.xml
